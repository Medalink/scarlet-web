[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
; The containers' environment (the Laravel settings) must reach the workers.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
php_admin_value[memory_limit] = 256M
