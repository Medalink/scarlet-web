# Production stack of scarlet-web on one droplet. Run it through deploy/dc, which adds the project name and the two
# env files: /srv/scarlet-web/.env (secrets, written once on the server) and /srv/scarlet-web/release.env (the image tag).
# Nothing but nginx listens on a public interface. Postgres and Redis live on the compose network only; php-fpm is
# published on 127.0.0.1 for nginx, which runs on the host network so it sees the real peer address.
name: scarlet-web

x-app: &app
  image: scarlet-web-app:${SCARLET_RELEASE}
  env_file: ../.env
  restart: unless-stopped
  networks: [backend]
  volumes:
    - logs:/app/storage/logs
    - /srv/scarlet-web/maps:/maps:ro

services:
  postgres:
    image: timescale/timescaledb-ha:pg18.6-ts2.32.0-r599.1@sha256:96b6033e7e54c26099f29cb46f634953b749b8c2c92c77bfb715cd630cdadf2e
    restart: unless-stopped
    networks: [backend]
    shm_size: 512mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=80
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    networks: [backend]
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    <<: *app
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  horizon:
    <<: *app
    user: www-data
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 120s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  schedule:
    <<: *app
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    image: scarlet-web-web:${SCARLET_RELEASE}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./nginx/fastcgi-app.conf:/etc/nginx/fastcgi-app.conf:ro
      - /srv/scarlet-web/aop.conf:/etc/nginx/aop.conf:ro
      - /srv/scarlet-web/tls:/etc/nginx/tls:ro

networks:
  backend:

volumes:
  pgdata:
  redisdata:
  logs:
