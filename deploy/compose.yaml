# Production stack of scarlet-web on one droplet. Run it through deploy/dc, which adds the project name and the two
# env files: /srv/scarlet-web/.env (secrets, written once on the server) and /srv/scarlet-web/release.env (which release
# runs where). Nothing but nginx listens on a public interface. Postgres and Redis live on the compose network only;
# php-fpm is published on 127.0.0.1 for nginx, which runs on the host network so it sees the real peer address.
#
# A release rolls out blue/green: the new release starts as app-blue or app-green beside the running one, and nginx's
# upstream moves to it with a reload (deploy/rollout.sh). horizon-blue or horizon-green and schedule run the active release.
name: scarlet-web

x-app: &app
  image: scarlet-web-app:${SCARLET_RELEASE:-none}
  env_file: ../.env
  restart: unless-stopped
  networks: [backend]
  volumes:
    - logs:/app/storage/logs
    - /srv/scarlet-web/maps:/maps:ro

x-after-databases: &after-databases
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: timescale/timescaledb-ha:pg18.6-ts2.32.0-r599.1@sha256:96b6033e7e54c26099f29cb46f634953b749b8c2c92c77bfb715cd630cdadf2e
    restart: unless-stopped
    networks: [backend]
    shm_size: 512mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=80
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    networks: [backend]
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The two php-fpm slots. Only the one nginx points at serves visitors. SIGQUIT lets php-fpm finish its requests.
  app-blue:
    <<: [*app, *after-databases]
    image: scarlet-web-app:${BLUE_RELEASE:-none}
    profiles: [blue]
    stop_signal: SIGQUIT
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:9001:9000"

  app-green:
    <<: [*app, *after-databases]
    image: scarlet-web-app:${GREEN_RELEASE:-none}
    profiles: [green]
    stop_signal: SIGQUIT
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:9002:9000"

  # One-off artisan commands of a release: deploy/dc run --rm tools php artisan migrate --force
  tools:
    <<: [*app, *after-databases]
    profiles: [tools]
    restart: "no"

  horizon-blue:
    <<: [*app, *after-databases]
    image: scarlet-web-app:${BLUE_RELEASE:-none}
    profiles: [blue]
    user: www-data
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 150s

  horizon-green:
    <<: [*app, *after-databases]
    image: scarlet-web-app:${GREEN_RELEASE:-none}
    profiles: [green]
    user: www-data
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 150s

  schedule:
    <<: [*app, *after-databases]
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s

  # The registry bin/deploy pushes new image layers to, so a release sends only the layers the droplet lacks. It listens on
  # the droplet's loopback only; bin/deploy reaches it through ssh.
  registry:
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    restart: unless-stopped
    networks: [backend]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5077:5000"
    volumes:
      - registrydata:/var/lib/registry

  # nginx is not rebuilt per release: its image is the pinned upstream one, its config comes from /srv/scarlet-web/nginx
  # (copied there by rollout.sh) and is reloaded, and the built assets of every release collect in /srv/scarlet-web/public.
  web:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    restart: unless-stopped
    network_mode: host
    command: ["nginx", "-c", "/etc/nginx/scarlet/nginx.conf", "-g", "daemon off;"]
    volumes:
      - /srv/scarlet-web/nginx:/etc/nginx/scarlet:ro
      - /srv/scarlet-web/state:/etc/nginx/state:ro
      - /srv/scarlet-web/tls:/etc/nginx/tls:ro
      - /srv/scarlet-web/public:/var/www/public:ro
      - /srv/scarlet-web/maps:/var/www/map-tiles:ro

networks:
  backend:

volumes:
  pgdata:
  redisdata:
  registrydata:
  logs:
