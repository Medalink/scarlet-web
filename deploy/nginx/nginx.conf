# nginx for scarletweb.io behind Cloudflare. It runs on the host network, so $remote_addr is the real peer, a
# Cloudflare address, and the real_ip module swaps in CF-Connecting-IP for those peers only.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 6m;

    # $remote_addr is the visitor after real_ip; $realip_remote_addr is the Cloudflare peer.
    log_format scarlet '$remote_addr peer=$realip_remote_addr "$request" $status $body_bytes_sent '
                       '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout scarlet;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    include /etc/nginx/scarlet/cloudflare-ips.conf;

    # upstream php { server 127.0.0.1:<port of the active slot>; }, rewritten by deploy/rollout.sh, then a reload.
    include /etc/nginx/state/upstream.conf;

    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Plain http: send a known host to https, drop the rest. Cloudflare already redirects at the edge.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name scarletweb.io www.scarletweb.io;
        return 301 https://scarletweb.io$request_uri;
    }

    # A name the certificate does not cover, or no name: no handshake.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.scarletweb.io;
        include /etc/nginx/state/aop.conf;
        return 301 https://scarletweb.io$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name scarletweb.io;
        include /etc/nginx/state/aop.conf;

        root /var/www/public;

        # The built assets carry a content hash in their name.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # The map art is served from disk: no PHP, no session, no Set-Cookie, so Cloudflare keeps it. The folder is the
        # one bin/deploy maps fills, mounted at /var/www/map-tiles. The URLs are the ones routes/maps.php answers in
        # development, and a tile's URL carries the build version, so its bytes never change.
        location ^~ /map-tiles/ {
            root /var/www;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location = /map-tiles/manifest.json {
            root /var/www;
            add_header Cache-Control "public, max-age=300";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # The item icons and a scene's textures and icons lie in the same folder. A file id names the same bytes for good.
        location ~ "^/item-icons/([0-9]{1,10})\.png$" {
            alias /var/www/map-tiles/items/icons/$1.png;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ "^/scene-art/([a-z-]{1,20})/(tex|icons)/([0-9]{1,10})\.png$" {
            alias /var/www/map-tiles/$1/$2/$3.png;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location = /index.php { return 404; }
        location ~ /\.(?!well-known) { return 404; }

        location / {
            try_files $uri @app;
        }

        location @app {
            include /etc/nginx/scarlet/fastcgi-app.conf;
            fastcgi_pass php;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;
        }
    }

    # Health checks of the deploy script: loopback only, no certificate, no Cloudflare in the way. 8081 follows the
    # active slot like the public server; 8091 and 8092 reach one slot each, so a new release is checked through this
    # same configuration before the upstream moves to it.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location / {
            include /etc/nginx/scarlet/fastcgi-app.conf;
            fastcgi_pass php;
        }
    }

    server {
        listen 127.0.0.1:8091;
        server_name localhost;

        location / {
            include /etc/nginx/scarlet/fastcgi-app.conf;
            fastcgi_pass 127.0.0.1:9001;
        }
    }

    server {
        listen 127.0.0.1:8092;
        server_name localhost;

        location / {
            include /etc/nginx/scarlet/fastcgi-app.conf;
            fastcgi_pass 127.0.0.1:9002;
        }
    }
}
