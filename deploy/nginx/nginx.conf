# nginx for scarletweb.io behind Cloudflare. It runs on the host network, so $remote_addr is the real peer, a
# Cloudflare address, and the real_ip module swaps in CF-Connecting-IP for those peers only.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 6m;

    # $remote_addr is the visitor after real_ip; $realip_remote_addr is the Cloudflare peer.
    log_format scarlet '$remote_addr peer=$realip_remote_addr "$request" $status $body_bytes_sent '
                       '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout scarlet;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    include /etc/nginx/cloudflare-ips.conf;

    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Plain http: send a known host to https, drop the rest. Cloudflare already redirects at the edge.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name scarletweb.io www.scarletweb.io;
        return 301 https://scarletweb.io$request_uri;
    }

    # A name the certificate does not cover, or no name: no handshake.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.scarletweb.io;
        include /etc/nginx/aop.conf;
        return 301 https://scarletweb.io$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name scarletweb.io;
        include /etc/nginx/aop.conf;

        root /var/www/public;

        # The built assets carry a content hash in their name.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location = /index.php { return 404; }
        location ~ /\.(?!well-known) { return 404; }

        location / {
            try_files $uri @app;
        }

        location @app {
            include /etc/nginx/fastcgi-app.conf;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;
        }
    }

    # The deploy script's health check: loopback only, no certificate, no Cloudflare in the way.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location / {
            include /etc/nginx/fastcgi-app.conf;
        }
    }
}
